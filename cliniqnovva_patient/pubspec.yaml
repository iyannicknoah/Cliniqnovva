name: cliniqnovva_patient
description: "Cliniqnovva Patient App — book appointments, chat with your clinic, and manage your care."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  image_picker: ^1.2.3
  image: ^4.9.1
  intl: ^0.20.2
  dio: ^5.10.0
  pdf: ^3.13.0
  printing: ^5.15.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.0.1
  geolocator: ^13.0.2
  add_2_calendar: ^3.0.1
  url_launcher: ^6.3.1
  flutter_riverpod: 2.6.1
  go_router: 15.1.2
  easy_localization: ^3.0.8
  heroicons: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  assets:
    - assets/translations/
    - assets/images/

  uses-material-design: true

  # General Sans (Fontshare, free for commercial/personal use — see
  # assets/fonts/LICENSE.txt), same single UI font as the web dashboard —
  # see cliniqnovva/DESIGN_LANGUAGE.md. Regular/Medium/Semibold/Bold only,
  # no italics anywhere.
  fonts:
    - family: General Sans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.otf
          weight: 600
        - asset: assets/fonts/GeneralSans-Bold.otf
          weight: 700
